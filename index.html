<!DOCTYPE html>
<html lang="sv" data-theme="paper" data-font="serif" data-width="normal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koden — Bokläsare</title>
  <meta name="description" content="Digital bokläsare för Koden">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261117d">
</head>
<body>
  <!-- Global reading progress bar -->
  <div class="progress-track" aria-hidden="true">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- Top Navigation Bar -->
  <header class="topbar" id="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="tocToggleBtn" aria-label="Innehållsförteckning" title="Innehållsförteckning (T)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="15" y2="12"></line>
          <line x1="3" y1="18" x2="18" y2="18"></line>
        </svg>
        <span class="btn-label">Kapitel</span>
      </button>
    </div>

    <div class="topbar-center">
      <button class="book-title-btn" id="coverBtn" title="Visa framsida">
        <span class="topbar-book-title" id="topbarBookTitle">Koden</span>
        <span class="topbar-chapter-indicator" id="topbarChapterIndicator">Laddar...</span>
      </button>
    </div>

    <div class="topbar-right">
      <button class="icon-btn" id="searchToggleBtn" aria-label="Sök i boken" title="Sök i boken (S)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <button class="icon-btn" id="bookmarkBtn" aria-label="Bokmärke" title="Spara bokmärke">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>
      <button class="icon-btn" id="settingsToggleBtn" aria-label="Utseende och textstorlek" title="Utseende och text">
        <span class="aa-icon">Aa</span>
      </button>
    </div>
  </header>

  <!-- Settings Popover -->
  <aside class="settings-popover" id="settingsPopover" hidden aria-label="Läsinställningar">
    <div class="settings-section">
      <div class="settings-label">Tema</div>
      <div class="theme-switcher">
        <button class="theme-chip" data-theme-val="paper" aria-pressed="true">
          <span class="theme-swatch swatch-paper"></span>
          <span>Papper</span>
        </button>
        <button class="theme-chip" data-theme-val="sepia" aria-pressed="false">
          <span class="theme-swatch swatch-sepia"></span>
          <span>Sepia</span>
        </button>
        <button class="theme-chip" data-theme-val="night" aria-pressed="false">
          <span class="theme-swatch swatch-night"></span>
          <span>Natt</span>
        </button>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-label">Typsnitt</div>
      <div class="segmented-control">
        <button class="seg-btn" data-font-val="serif" aria-pressed="true">Serif</button>
        <button class="seg-btn" data-font-val="sans" aria-pressed="false">Sans-serif</button>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-label">
        <span>Textstorlek</span>
        <span class="settings-value" id="fontSizeValue">19 px</span>
      </div>
      <div class="size-controls">
        <button class="size-btn" id="fontDecreaseBtn" aria-label="Minska textstorlek">A−</button>
        <input type="range" id="fontSizeSlider" min="15" max="25" step="1" value="19" aria-label="Textstorlek">
        <button class="size-btn" id="fontIncreaseBtn" aria-label="Öka textstorlek">A+</button>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-label">Spaltbredd</div>
      <div class="segmented-control">
        <button class="seg-btn" data-width-val="narrow" aria-pressed="false">Smal</button>
        <button class="seg-btn" data-width-val="normal" aria-pressed="true">Normal</button>
        <button class="seg-btn" data-width-val="wide" aria-pressed="false">Bred</button>
      </div>
    </div>
  </aside>

  <!-- Table of Contents Drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <nav class="toc-drawer" id="tocDrawer" aria-label="Innehållsförteckning" hidden>
    <div class="drawer-header">
      <div>
        <div class="drawer-eyebrow">Innehållsförteckning</div>
        <h2 class="drawer-title" id="drawerBookTitle">Koden</h2>
      </div>
      <button class="icon-btn" id="tocCloseBtn" aria-label="Stäng innehållsförteckning">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="drawer-stats" id="drawerStats"></div>

    <div class="bookmark-banner" id="bookmarkBanner" hidden>
      <div class="bookmark-banner-info">
        <span class="bookmark-banner-label">Sparat bokmärke</span>
        <span class="bookmark-banner-loc" id="bookmarkBannerLoc"></span>
      </div>
      <div class="bookmark-banner-actions">
        <button type="button" class="text-action-btn" id="jumpToBookmarkBtn">Gå dit</button>
        <button type="button" class="text-action-btn text-action-btn-secondary" id="removeBookmarkBtn" title="Ta bort bokmärke" onclick="window.__bokreaderRemoveBookmark && window.__bokreaderRemoveBookmark(event)">Ta bort</button>
      </div>
    </div>

    <ul class="toc-list" id="tocList"></ul>
  </nav>

  <!-- Search Modal -->
  <div class="search-modal" id="searchModal" hidden role="dialog" aria-modal="true" aria-label="Sök i boken">
    <div class="search-dialog">
      <div class="search-input-row">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="searchInput" placeholder="Sök efter ord, namn eller fraser i boken..." autocomplete="off">
        <button class="icon-btn" id="searchCloseBtn" aria-label="Stäng sök">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="search-meta" id="searchMeta">Skriv minst 2 tecken för att söka.</div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <!-- Main Reader Area -->
  <main class="reader-main" id="readerMain">
    <!-- Loading / Error State -->
    <div class="status-view" id="statusView">
      <div class="spinner"></div>
      <p>Läser in manuskript.md…</p>
    </div>

    <!-- Cover / Title Page View -->
    <section class="cover-view" id="coverView" hidden>
      <div class="cover-card">
        <div class="cover-ornament">§</div>
        <div class="cover-eyebrow">Digital utgåva</div>
        <h1 class="cover-title" id="coverTitle">Koden</h1>
        <p class="cover-subtitle" id="coverSubtitle"></p>
        <div class="cover-meta" id="coverMeta"></div>
        <div class="cover-actions">
          <button class="primary-btn" id="startReadingBtn">Börja läsa</button>
          <button class="secondary-btn" id="continueReadingBtn" hidden>Fortsätt där du slutade</button>
        </div>
        <div class="cover-chapters-preview">
          <div class="preview-heading">Kapitelöversikt</div>
          <ol class="cover-toc" id="coverToc"></ol>
        </div>
      </div>
    </section>

    <!-- Chapter Reading View -->
    <article class="chapter-article" id="chapterArticle" hidden>
      <header class="chapter-header">
        <div class="chapter-meta-row">
          <span class="chapter-number" id="chapterNumberLabel"></span>
          <span class="chapter-dot" aria-hidden="true">·</span>
          <span class="chapter-readtime" id="chapterReadTimeLabel"></span>
        </div>
        <h1 class="chapter-title" id="chapterTitle"></h1>
      </header>

      <div class="chapter-body" id="chapterBody"></div>

      <footer class="chapter-footer">
        <div class="chapter-end-ornament" aria-hidden="true">✦</div>
        <div class="chapter-nav">
          <button class="nav-card nav-prev" id="prevChapterBtn">
            <span class="nav-dir">← Föregående</span>
            <span class="nav-title" id="prevChapterTitle"></span>
          </button>
          <button class="nav-card nav-next" id="nextChapterBtn">
            <span class="nav-dir">Nästa →</span>
            <span class="nav-title" id="nextChapterTitle"></span>
          </button>
        </div>
      </footer>
    </article>
  </main>

  <!-- Toast Notification -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Optional offline fallback when opened directly via file:// -->
  <script src="manuskript-fallback.js?v=20261117d"></script>
  <script src="reader.js?v=20261117d"></script>
</body>
</html>
